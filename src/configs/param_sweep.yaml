EXPERIMENT_SETTINGS:
  seed: 123450
  write_dir: "../results"
  training_screen: "Broad"
  testing_screens: ['gCSI','GDSC2','GDSC1']

PAIR_SELECTION:
  delta_min: 0
  delta_max: 15
  delta_step: 1
  delta_scale: 0.01
  extra_deltas: []


TRAIN_OPTS:
  num_epochs: 30
  batch_size: 256
  opt_algo: 'sgd'
  lr: 0.00001
  momentum: 0.001
  weight_decay: 0.0
  # drop_outs: [0.5]
  

  

MODELS_AND_HYPERPARAMETERS:
    
  
  ECINET:
    hidden_sizes: []
    use_batch_norm: False
    drop_prob: 0.
  

  ONE_NARROW:
    hidden_sizes: [128]
    use_batch_norm: True 
    drop_prob: 0.5


  TWO_NARROW:
    hidden_sizes: [128,128]
    use_batch_norm: True
    drop_prob: 0.5



  

