EXPERIMENT_SETTINGS:
  seed: 123450
  write_dir: "../results/"
  training_screen: "Broad"
  testing_screens: ['gCSI','GDSC2','GDSC1']


PAIR_SELECTION:
  delta_min: 0
  delta_max: 25
  delta_step: 1
  delta_scale: 0.01
  extra_deltas: []


TRAIN_OPTS:
  num_epochs: 20
  checkpts: [5,10,15,20,30]
  batch_size: 256
  opt_algo: 'sgd'
  lrs: [0.00001]
  weight_decays: [0,0.1,0.01,1,5]
  # weight_decays: [0]
  drop_outs: [0.5]
  # drop_outs: [0.25]
  n_splits: 10
  


MODELS_AND_HYPERPARAMETERS:
    
  ECINET:
    hidden_sizes: []
    use_batch_norm: False
  
  ONE_LAYER:
    hidden_sizes: [128]
    use_batch_norm: True 

  TWO_LAYER:
    hidden_sizes: [128,128]
    use_batch_norm: True